services:
  crawler-pup:
    build: ./crawler-pup
    container_name: crawler-pup
    restart: unless-stopped
    environment:
      - DB_TYPE=${DB_TYPE:-pocketbase}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.me}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
      - POCKETBASE_TOKEN=${POCKETBASE_TOKEN:-}
      - POCKETBASE_UPLOAD_IMAGES=${POCKETBASE_UPLOAD_IMAGES:-true}
    volumes:
      - ./crawler-pup/logs:/app/logs
    networks:
      - aluga-net

  dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.me}
    container_name: aluga-dashboard
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.me}
      - VITE_POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.me}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aluga-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aluga-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - aluga-net

networks:
  aluga-net:
    driver: bridge
