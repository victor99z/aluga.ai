version: '3.8'

services:
  crawler-pup:
    build: ./crawler-pup
    container_name: crawler-pup
    restart: unless-stopped
    environment:
      - METRICS_PORT=${METRICS_PORT:-9100}
      - DB_TYPE=${DB_TYPE:-pocketbase}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.me}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
      - POCKETBASE_TOKEN=${POCKETBASE_TOKEN:-}
      - POCKETBASE_UPLOAD_IMAGES=${POCKETBASE_UPLOAD_IMAGES:-true}
    ports:
      - "9100:9100"
    volumes:
      - ./crawler-pup/logs:/app/logs

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command: >
      --web.enable-lifecycle
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
      --web.enable-admin-api
      --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/grafana/dashboards
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
